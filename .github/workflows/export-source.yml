name: Export source archive
on:
  push:
    branches: [export-source-temp]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          rm -f .github/workflows/export-source.yml
          zip -r project-repo-source.zip . -x 'node_modules/*' '.next/*' '.git/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: project-repo-source
          path: project-repo-source.zip
